buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }

    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://devrepo.kakao.com/nexus/content/groups/public/' }
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.8.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21")
        classpath("com.google.gms:google-services:4.4.2")
        classpath("com.google.firebase:perf-plugin:1.4.2")
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.2")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url 'https://devrepo.kakao.com/nexus/content/groups/public/' }
    }

    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.google.android.gms' &&
                details.requested.name == 'play-services-location') {
                details.useVersion '21.0.1'
            }
        }
    }
}

subprojects {
    // Play 16KB 페이지 요구: NDK 27 은 기본 4KB 정렬이라, 소스에서 빌드하는 네이티브 라이브러리
    // (react-native-mmkv, react-native-vision-camera 등)에 16KB 정렬을 켠다. NDK 28+ 로 올리면 기본값이라 지워도 된다.
    plugins.withId('com.android.library') {
        android.defaultConfig.externalNativeBuild.cmake.arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
    }

    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            def current = project.android.compileSdkVersion
            def currentInt = (current instanceof Integer) ? current : current.toString().replace('android-', '').toInteger()
            if (currentInt < 35) {
                project.android.compileSdkVersion 35
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
